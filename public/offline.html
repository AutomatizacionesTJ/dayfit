<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · dayfit</title>
    <style>
      :root { color-scheme: light dark; --bg: #fbfaf8; --fg: #141414; --soft: #6b6762; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0c0c; --fg: #f4f2ee; --soft: #9a958e; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 24px; }
      h1 { font-family: Georgia, serif; font-style: italic; font-weight: 400; font-size: 44px; margin: 0 0 8px; }
      p { color: var(--soft); margin: 0 0 24px; }
      button { border: 0; border-radius: 999px; padding: 12px 22px; background: var(--fg); color: var(--bg); font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <h1>dayfit</h1>
      <p>No tienes conexión. Vuelve a intentarlo en un momento.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
